server:
  port: 8080
  address: 127.0.0.1
spring:
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:accountsdb;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
build:
  version: "1.0.0"
accounts:
  message: "Local demonstration"
  contact-details:
    name: "EazyBank"
  on-call-support: []
  # Local addresses for the baseline.
---
spring:
  http:
    serviceclient:
      loans:
        base-url: ${LOANS_BASE_URL:http://localhost:8090}
      cards:
        base-url: ${CARDS_BASE_URL:http://localhost:9000}
