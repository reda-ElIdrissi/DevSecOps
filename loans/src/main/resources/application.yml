server:
  port: 8090
  address: 127.0.0.1
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3,TLSv1.2
    key-store: ${TLS_KEYSTORE}
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
spring:
  ssl:
    bundle:
      jks:
        outbound:
          truststore:
            location: ${TLS_TRUSTSTORE}
            password: ${TLS_TRUSTSTORE_PASSWORD}
            type: PKCS12
  application:
    name: loans
  datasource:
    url: jdbc:h2:mem:loansdb;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
build:
  version: "1.0.0"
loans:
  message: "Local demonstration"
  contact-details:
    name: "EazyBank"
  on-call-support: []
security:
  issuer: ${ISSUER_URI:https://localhost:8443/realms/eazybank}
